<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Move and Jump — Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <p id="intro"></p>
    <p id="rankingInfo"></p>

    <h2 id="shortcutsHeading"></h2>
    <table id="shortcuts"></table>
    <p id="shortcutError" role="alert"></p>

    <label>
      <input type="checkbox" id="caseSensitiveSearch" />
      <span id="caseSensitiveSearchLabel"></span>
    </label>
    <label>
      <input type="checkbox" id="fuzzySearch" />
      <span id="fuzzySearchLabel"></span>
    </label>
    <label>
      <input type="checkbox" id="searchAllAccounts" />
      <span id="searchAllAccountsLabel"></span>
    </label>
    <label>
      <input type="checkbox" id="resizeToFit" />
      <span id="resizeToFitLabel"></span>
    </label>
    <label>
      <input type="checkbox" id="centerOnParent" />
      <span id="centerOnParentLabel"></span>
    </label>
    <label>
      <span id="zoomLabel"></span>
      <input type="number" id="zoom" min="50" max="200" step="10" /> %
    </label>
    <script type="module" src="options.js"></script>
  </body>
</html>
