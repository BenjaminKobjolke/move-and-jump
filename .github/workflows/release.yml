name: Release

# Deliberately tag-triggered rather than firing on every push to main —
# publishing to addons.thunderbird.net should be a separate, deliberate
# step from landing a commit, not an automatic side effect of it.
on:
  push:
    tags:
      - "v*.*.*"
      # Bare-version tags (1.5.1) are what tools/release_create.bat pushes.
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tag objects, not just the tagged commit —
          # needed so the release step below can read this tag's own
          # annotation message (a shallow/default checkout may not
          # carry the tag object's contents).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Catches the case of tagging before bumping the version (or the
      # wrong commit) before it ever reaches ATN.
      - name: Verify tag matches manifest.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version $MANIFEST_VERSION"
            exit 1
          fi
          echo "VERSION=$MANIFEST_VERSION" >> "$GITHUB_ENV"

      - run: npm test
      # No `npm run lint`: web-ext lint is the Firefox linter and always
      # errors on Thunderbird's experiment_apis (MANIFEST_FIELD_PRIVILEGED).
      - run: npm run build

      # Submits the built .xpi to addons.thunderbird.net for signing
      # and (re-)publishing as a listed add-on. Requires an existing
      # ATN listing (see ARCHITECTURE.md) and ATN_API_KEY/ATN_API_SECRET
      # repo secrets. approvalTimeout: 0 means this only waits for
      # automated validation, not full human review, which can take
      # much longer than a CI run should block on — the public listing
      # updates whenever review actually completes, independent of
      # this workflow.
      #
      # DISABLED for now: releases go to GitHub only. Flip `if:` back to
      # true (or delete the line) to resume publishing to ATN — nothing
      # else needs changing, the secrets and the rest of the step stay as
      # they are. While this is off, the .xpi attached to the GitHub
      # release is UNSIGNED, so installing it needs
      # xpinstall.signatures.required=false (see README).
      - name: Sign and submit to addons.thunderbird.net
        if: false
        uses: kewisch/action-web-ext@v2
        with:
          cmd: sign
          source: web-ext-artifacts/move-and-jump-${{ env.VERSION }}.xpi
          channel: listed
          apiUrlPrefix: "https://addons.thunderbird.net/api/v4"
          apiKey: ${{ secrets.ATN_API_KEY }}
          apiSecret: ${{ secrets.ATN_API_SECRET }}
          approvalTimeout: 0

      # Release notes come from release_notes/<version>/en.json (title +
      # notes bullets), the same file the add-on bundles. tools/release_create.bat
      # pushes a lightweight tag, whose %(contents) would just be the commit
      # message, so the tag annotation is only the fallback for a hand-made
      # `git tag -a` release without an en.json.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FILE="release_notes/${VERSION}/en.json"
          if [ -f "$NOTES_FILE" ]; then
            BODY=$(node -e 'const n = require("./" + process.argv[1]); console.log(`# ${n.title}\n\n` + n.notes.map((x) => `- ${x}`).join("\n"))' "$NOTES_FILE")
          else
            BODY=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")
          fi
          NOTES=$(printf '%s\n\nFull changelog: https://github.com/%s/blob/main/CHANGELOG.md' \
            "$BODY" "${{ github.repository }}")
          gh release create "${GITHUB_REF_NAME}" web-ext-artifacts/*.xpi \
            --title "${GITHUB_REF_NAME}" \
            --notes "$NOTES"
