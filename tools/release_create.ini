; Config for `release-tool create`; run it via tools\release_create.bat.
; The release artifacts are built before the push; gh creates the GitHub
; release locally after the tag is pushed.

[Release]
scope = extension
versioning = semver

[Bats]
version_get = tools/windows/version_get.bat
build_increment = tools/windows/version_bump.bat
build_decrement = tools/windows/version_unbump.bat
translate = tools/windows/translate_release_notes.bat
build = tools/windows/build_release.bat

[GitHubRelease]
; Created locally with gh after the push, on the pushed bare tag (1.5.1): the
; Actions workflow has never run in this repo, so it can't be relied on for it.
enabled = true
; Explicit target: with the `upstream` fork remote present, gh would otherwise pick bovender/move-and-jump.
repo = BenjaminKobjolke/move-and-jump
assets = web-ext-artifacts/move-and-jump-{label}.xpi
