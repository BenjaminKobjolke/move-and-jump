<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title></title>
    <link rel="stylesheet" href="search.css" />
  </head>
  <body>
    <h1 id="heading"></h1>
    <input id="query" type="text" autocomplete="off" autofocus />
    <ul id="results"></ul>
    <p id="empty" class="empty" hidden></p>
    <p id="error" class="error" hidden></p>
    <div class="actions">
      <button id="cancelButton" type="button"></button>
      <button id="jumpButton" type="button"></button>
      <button id="moveButton" type="button"></button>
    </div>
    <script type="module" src="search.js"></script>
  </body>
</html>
